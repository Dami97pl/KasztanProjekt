<!DOCTYPE html>
<html lang="PL-pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menedżer zadań (TO-DO)</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            
        })
    </script>
</head>
<body>
    <div class="kontener">
        <header>
            <h1>Menedżer zadań (TO-DO)</h1>
        </header>

        <div class="zawartosc">
            <form class="formularz">
                <input type="text" id="tresc" placeholder="Treść zadania (min. 3 znaki)">
                <select id="priorytet">
                    <option value="niski">Niski</option>
                    <option value="sredni" selected>Średni</option>
                    <option value="wysoki">Wysoki</option>
                </select>
                <button type="submit">Dodaj</button>
            </form>

            <div class="filtry">
                <button type="button" class="filtr_status wszystkie">Wszystkie</button>
                <button type="button" class="filtr_status aktywne">Aktywne</button>
                <button type="button" class="filtr_status ukonczone">Ukończone</button>
                <select id="filtr_priorytet">
                    <option value="wszystkie">Wszystkie priorytety</option>
                    <option value="niski">Niski</option>
                    <option value="sredni">Średni</option>
                    <option value="wysoki">Wysoki</option>
                </select>
            </div>

            <div class="pasek">
                <div id="licznik_zadan" class="licznik_zadan">Zadań: 0, ukończonych: 0 (0%)</div>
                <button type="button" id="wszystkie_gotowe">Zaznacz wszystkie jako gotowe</button>
                <button type="button" id="usun_ukonczone">Usuń ukończone</button>
            </div>

            <ul id="lista" class="lista"></ul>

            <div id="brak_zadan" class="brak_zadan">
                <p>Brak zadań do wyświetlenia</p>
            </div>
        </div>
    </div>
</body>
</html>
